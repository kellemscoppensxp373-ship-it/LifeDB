name: Build Windows EXE

# Every push to main tracks actions and rebuilds the desktop app.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-win:
    name: Compile LifeDashboard .exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (Vite)
        run: npm run build

      - name: Compile Windows installer (electron-builder)
        run: npx electron-builder --win --publish never

      - name: List release output
        run: dir release
        shell: cmd

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeDashboard-win-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
